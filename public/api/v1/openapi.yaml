openapi: 3.1.0
info:
  title: PCMarket API
  version: "1.0.0"
  description: |
    Versioned JSON API for PCMarket's native iOS and Android apps.

    ## Authentication
    Send `Authorization: Bearer <access_token>` for every authenticated endpoint.
    Obtain a token pair from `POST /api/v1/sessions`, `POST /api/v1/sessions/refresh`
    or the Google mobile sign-in endpoint. The access token lasts 30 days and
    slides on use; the refresh token lasts 90 days and is single use.

    ## Envelopes
    Collections return `{ "data": [...], "meta": { page, per_page, total, total_pages } }`.
    Single resources return `{ "data": {...} }`. Errors return
    `{ "error": { "code", "message", "details" } }`.

    ## Locale
    Locale is negotiated from `Accept-Language`, then the user's stored locale,
    then Spanish. Error messages are translated into the negotiated locale.

    ## Pagination
    `page` (1-based) and `per_page` (maximum 50). Responses include `X-Total-Count`
    and `Link` headers. Cursor feeds (messages, notifications) use `before_id`
    and return `meta.next_before_id` / `meta.has_more`.

    ## Rate limits
    API requests: 300 per 5 minutes per token or IP. Sign-in: 10 per minute per IP
    and email. Sign-up: 5 per hour per IP. A 429 response carries `Retry-After`
    and the standard error envelope.
  contact:
    name: PCMarket
    email: support@pcmarket.example
servers:
  - url: https://api.pcmarket.example
    description: Production
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Auth
  - name: Catalogue
  - name: Buyer
  - name: Seller
  - name: Messaging
  - name: Notifications
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        example: en-GB,en;q=0.9
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    BeforeId:
      name: before_id
      in: query
      description: Return records with an id lower than this cursor.
      schema:
        type: integer
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    NoContent:
      description: Deleted or revoked.
    Unauthorized:
      description: Missing, invalid or expired access token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The token is valid but the action is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: Validation failed; `details` contains field errors.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The requested state transition is no longer possible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    FeatureDisabled:
      description: The feature flag is off.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Too many requests. `Retry-After` is set.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden, not_found, validation_failed, rate_limited, conflict, feature_disabled]
            message:
              type: string
            details:
              oneOf:
                - type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                - type: "null"
    Meta:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        facets:
          type: object
          additionalProperties: true
        applied_filters:
          type: array
          items:
            type: object
            additionalProperties: true
        next_before_id:
          type: integer
        has_more:
          type: boolean
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
        phone:
          type: string
        locale:
          type: string
          enum: [es, en, fr, de, it, pt]
        country_code:
          type: string
        role:
          type: string
          enum: [user, moderator, admin]
        marketing_opt_in:
          type: boolean
        confirmed:
          type: boolean
        avatar_url:
          type: string
          nullable: true
        notification_preferences:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              in_app:
                type: boolean
              email:
                type: boolean
    ApiSession:
      type: object
      properties:
        id:
          type: integer
        device_name:
          type: string
        platform:
          type: string
          enum: [ios, android, other]
        app_version:
          type: string
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
        current:
          type: boolean
    AuthPayload:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
        session:
          $ref: "#/components/schemas/ApiSession"
        user:
          $ref: "#/components/schemas/User"
    Category:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        position:
          type: integer
        depth:
          type: integer
        listings_count:
          type: integer
        active:
          type: boolean
        children:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    AttributeOption:
      type: object
      properties:
        id:
          type: integer
        value:
          type: string
        label:
          type: string
        position:
          type: integer
        popular:
          type: boolean
        active:
          type: boolean
    AttributeDefinition:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
        name:
          type: string
        group:
          type: string
        input_type:
          type: string
          enum: [single_select, multi_select, number, boolean, text]
        unit:
          type: string
          nullable: true
        filterable:
          type: boolean
        show_on_card:
          type: boolean
        position:
          type: integer
        active:
          type: boolean
        required_flag:
          type: boolean
        attribute_options:
          type: array
          items:
            $ref: "#/components/schemas/AttributeOption"
    Tag:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [product_label, seller_tag]
        colour:
          type: string
          nullable: true
        position:
          type: integer
        active:
          type: boolean
    Region:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        country_code:
          type: string
        position:
          type: integer
    Country:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        currency:
          type: string
        default_locale:
          type: string
        position:
          type: integer
    StoreSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        kind:
          type: string
          enum: [individual, business]
        verified:
          type: boolean
        city:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        country_code:
          type: string
        rating_average:
          type: number
        ratings_count:
          type: integer
        listings_count:
          type: integer
        logo_url:
          type: string
          nullable: true
    StoreDetail:
      allOf:
        - $ref: "#/components/schemas/StoreSummary"
        - type: object
          properties:
            description:
              type: string
            status:
              type: string
              enum: [active, suspended]
            handling_days:
              type: integer
            return_policy:
              type: string
            shipping_policy:
              type: string
            followers_count:
              type: integer
            vacation_mode:
              type: boolean
            vacation_message:
              type: string
            vacation_until:
              type: string
              format: date
              nullable: true
            for_sale_count:
              type: integer
            sold_count:
              type: integer
            banner_url:
              type: string
              nullable: true
            user:
              $ref: "#/components/schemas/User"
    ListingPhoto:
      type: object
      properties:
        id:
          type: integer
        position:
          type: integer
        thumb_url:
          type: string
        card_url:
          type: string
        large_url:
          type: string
    SpecValue:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
    ListingCard:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        price_cents:
          type: integer
        compare_at_price_cents:
          type: integer
          nullable: true
        currency:
          type: string
        condition:
          type: string
        status:
          type: string
        quantity:
          type: integer
        shipping_mode:
          type: string
        shipping_price_cents:
          type: integer
        free_shipping:
          type: boolean
        city:
          type: string
        region_id:
          type: integer
          nullable: true
        published_at:
          type: string
          format: date-time
        views_count:
          type: integer
        favorites_count:
          type: integer
        allow_offers:
          type: boolean
        seller_id:
          type: integer
        featured:
          type: boolean
        discount_percent:
          type: integer
          nullable: true
        store:
          $ref: "#/components/schemas/StoreSummary"
        category:
          $ref: "#/components/schemas/Category"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        primary_photo:
          $ref: "#/components/schemas/ListingPhoto"
    DeliveryEstimate:
      type: object
      properties:
        ships_on:
          type: string
          format: date
        delivered_from:
          type: string
          format: date
        delivered_to:
          type: string
          format: date
    ListingDetail:
      allOf:
        - $ref: "#/components/schemas/ListingCard"
        - type: object
          properties:
            description:
              type: string
            handling_days:
              type: integer
            postal_code:
              type: string
            country_code:
              type: string
            photos:
              type: array
              items:
                $ref: "#/components/schemas/ListingPhoto"
            specs:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  label:
                    type: string
                  values:
                    type: array
                    items:
                      $ref: "#/components/schemas/SpecValue"
            seller:
              $ref: "#/components/schemas/User"
            store_detail:
              $ref: "#/components/schemas/StoreDetail"
            delivery_estimate:
              $ref: "#/components/schemas/DeliveryEstimate"
            similar_listing_ids:
              type: array
              items:
                type: integer
    Address:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        line1:
          type: string
        line2:
          type: string
          nullable: true
        city:
          type: string
        region_id:
          type: integer
          nullable: true
        province_name:
          type: string
          nullable: true
        postal_code:
          type: string
        country_code:
          type: string
        phone:
          type: string
        default:
          type: boolean
    CartItem:
      type: object
      properties:
        id:
          type: integer
        quantity:
          type: integer
        unit_price_cents:
          type: integer
          nullable: true
        offer_id:
          type: integer
          nullable: true
        line_total_cents:
          type: integer
        effective_unit_price_cents:
          type: integer
        purchasable:
          type: boolean
        listing:
          $ref: "#/components/schemas/ListingCard"
    Cart:
      type: object
      properties:
        id:
          type: integer
        item_count:
          type: integer
        subtotal_cents:
          type: integer
        shipping_cents:
          type: integer
        total_cents:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        groups:
          type: array
          items:
            type: object
            additionalProperties: true
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        listing_id:
          type: integer
        quantity:
          type: integer
        unit_price_cents:
          type: integer
        shipping_cents:
          type: integer
        line_total_cents:
          type: integer
        title:
          type: string
        seller_name:
          type: string
        photo_url:
          type: string
          nullable: true
        specs:
          type: object
          additionalProperties: true
    Order:
      type: object
      properties:
        id:
          type: integer
        number:
          type: string
        status:
          type: string
          enum: [pending_payment, paid, shipped, delivered, completed, cancelled, refunded, disputed]
        fulfilment:
          type: string
          enum: [shipping, local_pickup]
        subtotal_cents:
          type: integer
        shipping_cents:
          type: integer
        commission_cents:
          type: integer
        total_cents:
          type: integer
        currency:
          type: string
        tracking_carrier:
          type: string
          nullable: true
        tracking_number:
          type: string
          nullable: true
        paid_at:
          type: string
          format: date-time
          nullable: true
        shipped_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        buyer_protection_ends_at:
          type: string
          format: date-time
          nullable: true
        store:
          $ref: "#/components/schemas/StoreSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        review_id:
          type: integer
          nullable: true
        reviewable:
          type: boolean
    Checkout:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, paid, failed, expired, cancelled]
        subtotal_cents:
          type: integer
        shipping_cents:
          type: integer
        total_cents:
          type: integer
        currency:
          type: string
        payment_intent_id:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
    PaymentSheet:
      type: object
      properties:
        publishable_key:
          type: string
        customer_id:
          type: string
        ephemeral_key_secret:
          type: string
        payment_intent_id:
          type: string
        client_secret:
          type: string
    Review:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        store_id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        body:
          type: string
        status:
          type: string
          enum: [visible, hidden]
        seller_reply:
          type: string
          nullable: true
        seller_replied_at:
          type: string
          format: date-time
          nullable: true
        reviewer:
          $ref: "#/components/schemas/User"
        editable:
          type: boolean
    Message:
      type: object
      properties:
        id:
          type: integer
        conversation_id:
          type: integer
        sender_id:
          type: integer
        kind:
          type: string
          enum: [text, system, offer]
        body:
          type: string
        raw_body:
          type: string
        metadata:
          type: object
          additionalProperties: true
        sender:
          $ref: "#/components/schemas/User"
        images:
          type: array
          items:
            type: object
            properties:
              thumb_url:
                type: string
              card_url:
                type: string
              original_url:
                type: string
        read_at:
          type: string
          format: date-time
          nullable: true
        hidden_at:
          type: string
          format: date-time
          nullable: true
        safety_flagged:
          type: boolean
    Offer:
      type: object
      properties:
        id:
          type: integer
        listing_id:
          type: integer
        conversation_id:
          type: integer
        buyer_id:
          type: integer
        offerer_id:
          type: integer
        recipient_id:
          type: integer
          nullable: true
        amount_cents:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum: [pending, accepted, declined, countered, expired, withdrawn]
        message:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
        counter_offer_id:
          type: integer
          nullable: true
        acceptable:
          type: boolean
        redeemable:
          type: boolean
    Conversation:
      type: object
      properties:
        id:
          type: integer
        listing_id:
          type: integer
          nullable: true
        buyer_id:
          type: integer
        seller_id:
          type: integer
        store_id:
          type: integer
        title:
          type: string
        last_message_at:
          type: string
          format: date-time
          nullable: true
        unread_count:
          type: integer
        archived:
          type: boolean
        store:
          $ref: "#/components/schemas/StoreSummary"
        buyer:
          $ref: "#/components/schemas/User"
        seller:
          $ref: "#/components/schemas/User"
        last_message:
          $ref: "#/components/schemas/Message"
    Notification:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        notifiable_type:
          type: string
          nullable: true
        notifiable_id:
          type: integer
          nullable: true
        params:
          type: object
          additionalProperties: true
        message:
          type: string
        read_at:
          type: string
          format: date-time
          nullable: true
        unread:
          type: boolean
    SavedSearch:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category_id:
          type: integer
          nullable: true
        query_params:
          type: object
          additionalProperties: true
        frequency:
          type: string
          enum: [instant, daily, weekly]
        email_alerts:
          type: boolean
        last_notified_at:
          type: string
          format: date-time
          nullable: true
    DeviceToken:
      type: object
      properties:
        id:
          type: integer
        platform:
          type: string
          enum: [ios, android, other]
        token:
          type: string
        last_seen_at:
          type: string
          format: date-time
    LegalPage:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        title:
          type: string
        version:
          type: string
        locale:
          type: string
        country_code:
          type: string
        published_at:
          type: string
          format: date-time
        effective_at:
          type: string
          format: date-time
        body_html:
          type: string
        body_plain:
          type: string
    Game:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        cover_url:
          type: string
          nullable: true
        min_gpu_tier:
          type: object
          additionalProperties:
            type: integer
        min_cpu_tier:
          type: object
          additionalProperties:
            type: integer
    Analytics:
      type: object
      properties:
        range:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        revenue_cents:
          type: integer
        orders_count:
          type: integer
        units_sold:
          type: integer
        average_order_cents:
          type: integer
        views:
          type: integer
        conversion_rate:
          type: number
        favourites_gained:
          type: integer
        new_followers:
          type: integer
        revenue_by_day:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              amount_cents:
                type: integer
        top_by_views:
          type: array
          items:
            type: object
            additionalProperties: true
        top_by_revenue:
          type: array
          items:
            type: object
            additionalProperties: true
        pending:
          type: object
          additionalProperties:
            type: integer
paths:
  /api/v1/sessions:
    get:
      tags: [Auth]
      summary: List my active device sessions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiSession"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
                device_name:
                  type: string
                platform:
                  type: string
                  enum: [ios, android, other]
                app_version:
                  type: string
      responses:
        "201":
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/sessions/current:
    delete:
      tags: [Auth]
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Revoke one of my sessions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "404":
          $ref: "#/components/responses/NotFound"
