# Kamal 2 deployment template for PCMarket. Replace the placeholder hosts,
# registry and domains with real values; never commit real secrets.
service: pcmarket

# Use your registry namespace, e.g. ghcr.io/your-org/pcmarket.
image: your-registry/pcmarket

servers:
  web:
    - 203.0.113.10
  job:
    hosts:
      - 203.0.113.10
    cmd: bin/jobs

# Let Kamal terminate TLS with Let's Encrypt. Keep Cloudflare in Full mode if
# you put it in front of the proxy.
proxy:
  ssl: true
  host: pcmarket.example

registry:
  server: ghcr.io
  username: your-user
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - APP_TEST_TWO_DATABASE_PASSWORD
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - STRIPE_SECRET_KEY
    - STRIPE_PUBLISHABLE_KEY
    - STRIPE_WEBHOOK_SECRET
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - SMTP_USER
    - SMTP_PASSWORD
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
  clear:
    APP_HOST: pcmarket.example
    APP_HOSTS: pcmarket.example
    RAILS_LOG_LEVEL: info
    WEB_CONCURRENCY: 2
    RAILS_MAX_THREADS: 5
    # The web role does not process jobs; the `job` server runs bin/jobs.
    SOLID_QUEUE_IN_PUMA: false
    ACTIVE_STORAGE_SERVICE: local
    NOINDEX: 0

# Optional managed PostgreSQL accessory. Prefer a managed database in
# production by pointing DATABASE_URL at it and removing this block.
