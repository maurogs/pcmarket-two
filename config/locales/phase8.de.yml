  trust:
    meta:
      title: Vertrauen und Sicherheit
      description: "Zurückgehaltene Zahlungen, geprüfte Verkäufer und echter Support: So schützen wir jeden Einkauf auf PCMarket."
    eyebrow: Vertrauen und Sicherheit
    title: Ist PCMarket sicher?
    subtitle: "Ja: Wir halten die Zahlung zurück, prüfen Verkäufer und greifen ein, wenn etwas schiefgeht. So kümmern wir uns um jeden Einkauf, vom ersten Klick bis zur Lieferung."
    cta:
      browse: Anzeigen entdecken
      contact: Support kontaktieren
      title: Sicher kaufen
      body: Tausende Enthusiasten kaufen und verkaufen bereits Teile auf PCMarket. Mach mit und wisse, dass dein Geld geschützt ist.
      sell: Mit dem Verkaufen beginnen
    stats:
      label: Plattformzahlen
      listings_sold: verkaufte Anzeigen
      active_sellers: aktive Verkäufer
      average_rating: "Durchschnittsbewertung (%{count} Bewertungen)"
    protection:
      title: So funktioniert der Käuferschutz
      subtitle: Dein Geld erreicht den Verkäufer erst, wenn du bestätigst, dass alles in Ordnung ist.
      steps:
        hold:
          title: Wir halten die Zahlung zurück
          body: Beim Bezahlen wird der Betrag sicher zurückgehalten. Der Verkäufer weiß, dass der Auftrag echt ist, und du setzt dein Geld nicht aufs Spiel.
        ship:
          title: Der Artikel wird mit Sendungsverfolgung verschickt
          body: Der Verkäufer packt die Bestellung und trägt eine Sendungsnummer ein. Du kannst die Lieferung in deinem Konto verfolgen.
        inspect:
          title: Du prüfst den Artikel
          body: "Du hast %{days} Tage ab Lieferung, um zu prüfen, ob alles der Beschreibung entspricht. Falls nicht, eröffne vor der Freigabe der Zahlung ein Problem."
    covered:
      title: Was der Käuferschutz abdeckt
      items:
        - Der Artikel kommt nicht innerhalb der erwarteten Frist an.
        - Er kommt beschädigt an oder entspricht nicht der Beschreibung.
        - Der Verkäufer storniert nach der Zahlung.
        - Der Artikel ist gefälscht oder verboten.
        - Du erhältst etwas anderes als gekauft.
      note: Der Schutz gilt für Zahlungen innerhalb von PCMarket. Zahlungen außerhalb der Plattform können nicht geltend gemacht werden.
    verified:
      title: Was „geprüfter Verkäufer“ bedeutet
      intro: Das Prüfsiegel ist nicht automatisch. Wir vergeben es nach Prüfung von Vertrauenssignalen.
      items:
        - Identität und Kontaktdaten bestätigt.
        - Eine Aktivitätshistorie ohne schwerwiegende Vorfälle.
        - Ein korrekt eingerichtetes Stripe-Auszahlungskonto.
        - Anzeigen, die unseren Katalogregeln entsprechen.
    safety:
      title: Sicherheitstipps
      subtitle: Wenige Sekunden Vorsicht verhindern fast jedes Problem.
      tips:
        - Zahle niemals außerhalb von PCMarket: Sonst verlierst du den Käuferschutz.
        - Sei vorsichtig, wenn jemand Bizum oder eine direkte Überweisung „ohne Gebühren“ verlangt.
        - Wähle bei persönlichen Treffen einen öffentlichen, belebten Ort.
        - Prüfe die Seriennummer und teste den Artikel, bevor du einen Barverkauf abschließt.
        - Halte die Kommunikation auf der Plattform und sei bei externen Links misstrauisch.
    report:
      title: So meldest du etwas
      body: Wenn du eine verdächtige Anzeige, eine beleidigende Nachricht oder einen möglichen Betrug siehst, nutze die Meldefunktion der Anzeige oder des Profils. Wir prüfen jede Meldung und können Inhalte entfernen, Konten sperren und mit Behörden zusammenarbeiten.
      cta: Anzeige melden
      contact: Support schreiben
    contact:
      title: Brauchst du Hilfe?
      body: Unser Team antwortet montags bis freitags auf Deutsch und Spanisch. Schildere uns möglichst genau, was passiert ist, und wir helfen dir.
    faq:
      title: Häufige Fragen
      items:
        - question: Wann erhält der Verkäufer das Geld?
          answer: Wenn du die Lieferung bestätigst oder die Schutzfrist ohne Problem endet. Bis dahin bleibt der Betrag zurückgehalten.
        - question: Kann ich ohne Konto kaufen?
          answer: Du kannst ohne Konto stöbern, zum Bezahlen brauchst du aber ein bestätigtes Konto. So können wir den Kauf schützen und dich über die Lieferung informieren.
        - question: Was passiert, wenn der Artikel nicht ankommt?
          answer: Eröffne vor Ablauf der Frist ein Problem aus der Bestellung. Kann der Verkäufer den Versand nicht belegen, erstatten wir dir den Betrag.
        - question: Ist der Versand inklusive?
          answer: Jede Anzeige nennt ihre Versandkosten. Viele Verkäufer bieten kostenlosen Versand an, und du kannst danach filtern.
        - question: Kann ich einen Artikel zurückgeben, der mir nicht gefällt?
          answer: Bei einem gewerblichen Verkäufer hast du 14 Tage Widerrufsrecht. Zwischen Privatpersonen gibt es dieses gesetzliche Recht nicht, aber der Käuferschutz deckt Artikel ab, die nicht der Beschreibung entsprechen.
        - question: Woran erkenne ich einen zuverlässigen Verkäufer?
          answer: Prüfe Profil, Bewertungen und das Prüfsiegel. Du kannst auch vor dem Kauf eine Nachricht senden.
        - question: Welche Zahlungsmethoden akzeptiert ihr?
          answer: Kartenzahlungen über Stripe. Wir akzeptieren kein Bargeld und keine Überweisungen außerhalb der Plattform, weil wir dich dann nicht schützen könnten.
        - question: Wie melde ich eine Anzeige?
          answer: Klicke in der Anzeige oder im Profil auf „Melden“ und wähle einen Grund. Unser Team prüft die Meldung und informiert dich über die Entscheidung.
