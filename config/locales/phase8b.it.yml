  sell_to_us:
    seo:
      title: Vendi la tua GPU o CPU a PCMarket
      description: Ottieni un’offerta immediata per la tua scheda grafica o processore, spedisci con etichetta prepagata e ricevi il pagamento con bonifico.
    hero:
      eyebrow: Vendici
      title: Trasforma l’hardware inutilizzato in denaro, senza pubblicarlo
      description: Scegli la GPU o la CPU, rispondi a quattro domande sulle condizioni e ricevi un’offerta ferma in pochi secondi. Se accetti, ti inviamo un’etichetta di spedizione prepagata.
      cta: Ottieni un’offerta immediata
      how_it_works: Come funziona
    prices:
      title: Esempi di pagamento
      description: Un estratto dei prezzi di acquisto attuali. Il tuo preventivo immediato usa il modello e le condizioni esatti.
      gpus: Schede grafiche
      cpus: Processori
      model: Modello
      empty: Nessun prezzo pubblicato per questo componente.
      note: I pagamenti sono stime prima dell’ispezione. L’offerta mostrata nel preventivo è quella che rispettiamo.
    how:
      title: Come funziona
      description: Quattro passaggi dal tuo componente al bonifico.
      steps:
        offer:
          title: Ottieni un’offerta
          body: Scegli modello e condizioni. L’offerta immediata è valida sette giorni.
        ship:
          title: Spedisci gratis
          body: Accetta l’offerta e ti inviamo via email un’etichetta prepagata con le istruzioni per l’imballaggio.
        inspect:
          title: La ispezioniamo
          body: Testiamo il componente e confermiamo le condizioni entro due giorni lavorativi.
        paid:
          title: Ricevi il pagamento
          body: Trasferiamo l’importo concordato sul tuo IBAN, di solito entro un giorno lavorativo.
    faq:
      title: Domande prima di vendere
      items:
        condition:
          question: Cosa significa condizioni «buone»?
          answer: Il componente funziona normalmente, non presenta danni fisici e mostra solo lievi segni d’uso. La mancanza di scatola o accessori riduce l’offerta tramite le domande sulle condizioni.
        shipping:
          question: Devo pagare la spedizione?
          answer: No. Dopo l’accettazione inviamo un’etichetta prepagata e assicurata. Imballa il componente con cura in una busta antistatica e una scatola robusta.
        payment:
          question: Come e quando vengo pagato?
          answer: Con bonifico sull’IBAN indicato dopo l’accettazione. Paghiamo entro un giorno lavorativo dall’ispezione.
        data:
          question: Cosa succede ai miei dati personali?
          answer: Conserviamo il tuo IBAN cifrato, lo usiamo solo per questo pagamento e manteniamo la richiesta per il periodo contabile richiesto dalla legge.
    cta:
      title: Vuoi sapere quanto vale il tuo hardware?
      description: Il preventivo richiede meno di un minuto e non ti impegna.
      button: Inizia il preventivo
