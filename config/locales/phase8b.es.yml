    seo:
      title: Vende tu GPU o CPU a PCMarket
      description: Consigue una oferta instantánea por tu tarjeta gráfica o procesador, envíalo con una etiqueta prepagada y cobra por transferencia.
    hero:
      eyebrow: Véndenos
      title: Convierte el hardware que no usas en dinero, sin publicarlo
      description: Elige tu GPU o CPU, responde cuatro preguntas sobre su estado y recibe una oferta firme en segundos. Si la aceptas, te enviamos una etiqueta de envío prepagada.
      cta: Conseguir oferta instantánea
      how_it_works: Cómo funciona
    prices:
      title: Ejemplos de pago
      description: Una muestra de los precios de compra actuales. Tu presupuesto instantáneo usa el modelo y el estado exactos.
      gpus: Tarjetas gráficas
      cpus: Procesadores
      model: Modelo
      empty: Todavía no hay precios publicados para este componente.
      note: Los pagos son estimaciones antes de la inspección. La oferta que ves en el presupuesto es la que respetamos.
    how:
      title: Cómo funciona
      description: Cuatro pasos desde tu pieza hasta la transferencia.
      steps:
        offer:
          title: Consigue una oferta
          body: Elige el modelo y el estado. La oferta instantánea es válida durante siete días.
        ship:
          title: Envíalo gratis
          body: Acepta la oferta y te enviamos por correo una etiqueta prepagada con instrucciones de embalaje.
        inspect:
          title: Lo inspeccionamos
          body: Probamos el componente y confirmamos su estado en dos días laborables.
        paid:
          title: Cobra
          body: Transferimos el importe acordado a tu IBAN, normalmente en un día laborable.
    faq:
      title: Preguntas antes de vender
      items:
        condition:
          question: ¿Qué se considera estado «bueno»?
          answer: El componente funciona con normalidad, no tiene daños físicos y muestra solo signos leves de uso. La falta de caja o accesorios reduce la oferta mediante las preguntas de estado.
        shipping:
          question: ¿Pago el envío?
          answer: No. Cuando aceptas la oferta enviamos una etiqueta prepagada y asegurada. Embala el componente con cuidado en una bolsa antiestática y una caja resistente.
        payment:
          question: ¿Cómo y cuándo cobro?
          answer: Por transferencia al IBAN que indicas al aceptar. Pagamos en un día laborable desde la inspección.
        data:
          question: ¿Qué pasa con mis datos personales?
          answer: Guardamos tu IBAN cifrado, lo usamos solo para este pago y conservamos la solicitud durante el plazo contable legalmente exigido.
    cta:
      title: ¿Quieres saber cuánto vale tu hardware?
      description: El presupuesto tarda menos de un minuto y no te compromete a nada.
      button: Empezar mi presupuesto
