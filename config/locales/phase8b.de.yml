  sell_to_us:
    seo:
      title: Verkaufe deine GPU oder CPU an PCMarket
      description: Erhalte ein sofortiges Angebot für deine Grafikkarte oder CPU, versende sie mit vorbezahltem Etikett und erhalte Geld per Überweisung.
    hero:
      eyebrow: An uns verkaufen
      title: Mach aus ungenutzter Hardware Geld, ohne sie zu inserieren
      description: Wähle deine GPU oder CPU, beantworte vier Fragen zum Zustand und erhalte in Sekunden ein verbindliches Angebot. Wenn du annimmst, senden wir dir ein vorbezahltes Versandetikett.
      cta: Sofortangebot erhalten
      how_it_works: So funktioniert es
    prices:
      title: Beispielauszahlungen
      description: Ein Auszug aktueller Ankaufspreise. Dein Sofortangebot verwendet das genaue Modell und den Zustand.
      gpus: Grafikkarten
      cpus: Prozessoren
      model: Modell
      empty: Für diese Komponente sind noch keine Preise veröffentlicht.
      note: Auszahlungen sind Schätzungen vor der Prüfung. Das im Angebotsprozess gezeigte Angebot halten wir ein.
    how:
      title: So funktioniert es
      description: Vier Schritte von deinem Ersatzteil bis zur Überweisung.
      steps:
        offer:
          title: Angebot erhalten
          body: Wähle Modell und Zustand. Das Sofortangebot gilt sieben Tage.
        ship:
          title: Kostenlos versenden
          body: Nimm das Angebot an und wir mailen dir ein vorbezahltes Etikett mit Verpackungshinweisen.
        inspect:
          title: Wir prüfen es
          body: Wir testen die Komponente und bestätigen den Zustand innerhalb von zwei Werktagen.
        paid:
          title: Geld erhalten
          body: Wir überweisen den vereinbarten Betrag auf deine IBAN, meist innerhalb eines Werktags.
    faq:
      title: Fragen vor dem Verkauf
      items:
        condition:
          question: Was gilt als „guter“ Zustand?
          answer: Die Komponente funktioniert normal, hat keine physischen Schäden und zeigt nur leichte Gebrauchsspuren. Fehlende Verpackung oder Zubehör senken das Angebot über die Zustandsfragen.
        shipping:
          question: Zahle ich den Versand?
          answer: Nein. Nach Annahme senden wir ein vorbezahltes, versichertes Etikett. Verpacke die Komponente sorgfältig in einer antistatischen Tüte und einem stabilen Karton.
        payment:
          question: Wie und wann werde ich bezahlt?
          answer: Per Überweisung auf die nach der Annahme angegebene IBAN. Wir zahlen innerhalb eines Werktags nach der Prüfung.
        data:
          question: Was passiert mit meinen persönlichen Daten?
          answer: Wir speichern deine IBAN verschlüsselt, verwenden sie nur für diese Auszahlung und bewahren die Anfrage für die gesetzlich vorgeschriebene Buchhaltungsfrist auf.
    cta:
      title: Neugierig, was deine Hardware wert ist?
      description: Das Angebot dauert weniger als eine Minute und verpflichtet dich zu nichts.
      button: Angebot starten
