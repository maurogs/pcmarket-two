  sell_to_us:
    seo:
      title: Sell your GPU or CPU to PCMarket
      description: Get an instant offer for your graphics card or processor, ship it with a prepaid label and get paid by bank transfer.
    hero:
      eyebrow: Sell to us
      title: Turn spare hardware into money, without listing it
      description: Choose your GPU or CPU, answer four condition questions and get a firm offer in seconds. If you accept, we send a prepaid shipping label.
      cta: Get an instant offer
      how_it_works: How it works
    prices:
      title: Example payouts
      description: A sample of current buyback prices. Your instant quote uses the exact model and condition.
      gpus: Graphics cards
      cpus: Processors
      model: Model
      empty: No prices published for this component yet.
      note: Payouts are estimates before inspection. The offer shown in the quote flow is the one we honour.
    how:
      title: How it works
      description: Four steps from your spare part to a bank transfer.
      steps:
        offer:
          title: Get an offer
          body: Pick the model and condition. The instant offer is valid for seven days.
        ship:
          title: Ship it free
          body: Accept the offer and we email a prepaid label with packing instructions.
        inspect:
          title: We inspect it
          body: We test the component and confirm the condition within two working days.
        paid:
          title: Get paid
          body: We transfer the agreed amount to your IBAN, usually within one working day.
    faq:
      title: Questions before you sell
      items:
        condition:
          question: What counts as “good” condition?
          answer: The component works normally, has no physical damage and shows only light signs of use. Missing boxes or accessories lower the offer through the condition questions.
        shipping:
          question: Do I pay for shipping?
          answer: No. Once you accept the offer we send a prepaid, insured label. Pack the component carefully in an anti-static bag and a sturdy box.
        payment:
          question: How and when do I get paid?
          answer: By bank transfer to the IBAN you provide after accepting. We pay within one working day of the inspection.
        data:
          question: What happens to my personal data?
          answer: We store your IBAN encrypted, use it only for this payout and keep the request for the legally required accounting period.
    cta:
      title: Ready to see what your hardware is worth?
      description: The quote takes less than a minute and does not commit you to anything.
      button: Start my quote
