  trust:
    meta:
      title: Fiducia e sicurezza
      description: "Pagamenti trattenuti, venditori verificati e supporto reale: ecco come proteggiamo ogni acquisto su PCMarket."
    eyebrow: Fiducia e sicurezza
    title: PCMarket è sicuro?
    subtitle: "Sì: tratteniamo il pagamento, verifichiamo i venditori e interveniamo se qualcosa va storto. Così ci prendiamo cura di ogni acquisto, dal primo clic alla consegna."
    cta:
      browse: Esplora gli annunci
      contact: Parla con il supporto
      title: Compra con fiducia
      body: Migliaia di appassionati comprano e vendono già componenti su PCMarket. Unisciti a loro sapendo che il tuo denaro è protetto.
      sell: Inizia a vendere
    stats:
      label: Numeri della piattaforma
      listings_sold: annunci venduti
      active_sellers: venditori attivi
      average_rating: "valutazione media (%{count} recensioni)"
    protection:
      title: Come funziona la protezione dell'acquirente
      subtitle: Il tuo denaro non arriva al venditore finché non confermi che tutto è a posto.
      steps:
        hold:
          title: Tratteniamo il pagamento
          body: Al pagamento l'importo viene trattenuto in sicurezza. Il venditore sa che l'ordine è reale e tu non esponi i tuoi fondi.
        ship:
          title: L'articolo parte con tracciamento
          body: Il venditore prepara l'ordine e inserisce il numero di tracciamento. Puoi seguire la consegna dal tuo account.
        inspect:
          title: Controlli l'articolo
          body: "Hai %{days} giorni dalla consegna per verificare che tutto corrisponda alla descrizione. In caso contrario, apri una segnalazione prima del rilascio del pagamento."
    covered:
      title: Cosa copre la protezione dell'acquirente
      items:
        - L'articolo non arriva nei tempi previsti.
        - Arriva danneggiato o non corrisponde alla descrizione.
        - Il venditore annulla dopo il pagamento.
        - L'articolo è contraffatto o vietato.
        - Ricevi qualcosa di diverso da ciò che hai comprato.
      note: La protezione copre gli acquisti pagati su PCMarket. I pagamenti fuori dalla piattaforma non possono essere reclamati.
    verified:
      title: Cosa significa "venditore verificato"
      intro: Il sigillo di verifica non è automatico. Lo assegniamo dopo aver controllato segnali di fiducia.
      items:
        - Identità e recapiti confermati.
        - Uno storico di attività senza incidenti gravi.
        - Un conto di incasso Stripe configurato correttamente.
        - Annunci conformi alle nostre regole di catalogo.
    safety:
      title: Consigli di sicurezza
      subtitle: Pochi secondi di attenzione evitano quasi tutti i problemi.
      tips:
        - Non pagare mai fuori da PCMarket: perderesti la protezione dell'acquirente.
        - Diffida di chi chiede Bizum o un bonifico diretto per "saltare le commissioni".
        - Se vi incontrate di persona, scegliete un luogo pubblico e affollato.
        - Controlla il numero di serie e prova l'articolo prima di concludere una vendita in contanti.
        - Mantieni la conversazione sulla piattaforma e diffida dei link esterni.
    report:
      title: Come segnalare
      body: Se vedi un annuncio sospetto, un messaggio offensivo o una possibile truffa, usa il pulsante di segnalazione dell'annuncio o del profilo. Esaminiamo ogni segnalazione e possiamo rimuovere contenuti, sospendere account e collaborare con le autorità.
      cta: Segnala un annuncio
      contact: Scrivi al supporto
    contact:
      title: Ti serve aiuto?
      body: Il nostro team risponde in italiano e spagnolo dal lunedì al venerdì. Raccontaci cosa è successo con quanti più dettagli possibile e ti aiuteremo.
    faq:
      title: Domande frequenti
      items:
        - question: Quando riceve il denaro il venditore?
          answer: Quando confermi la consegna o scade il periodo di protezione senza problemi. Fino ad allora l'importo resta trattenuto.
        - question: Posso comprare senza account?
          answer: Puoi esplorare senza account, ma per pagare serve un account confermato. Così possiamo proteggere l'acquisto e avvisarti della consegna.
        - question: Cosa succede se l'articolo non arriva?
          answer: Apri una segnalazione dall'ordine prima della scadenza. Se il venditore non può dimostrare la spedizione, ti rimborsiamo.
        - question: La spedizione è inclusa?
          answer: Ogni annuncio indica il costo di spedizione. Molti venditori offrono la spedizione gratuita e puoi filtrare per questa opzione.
        - question: Posso restituire un articolo che non mi convince?
          answer: Se compri da un venditore professionista hai 14 giorni di recesso. Tra privati questo diritto non esiste, ma la protezione copre gli articoli non conformi alla descrizione.
        - question: Come capisco se un venditore è affidabile?
          answer: Controlla profilo, recensioni e sigillo di verifica. Puoi anche scrivergli prima di comprare.
        - question: Quali metodi di pagamento accettate?
          answer: Pagamenti con carta elaborati da Stripe. Non accettiamo contanti o bonifici fuori dalla piattaforma perché non potremmo proteggerti.
        - question: Come segnalo un annuncio?
          answer: Premi "Segnala" nell'annuncio o nel profilo e scegli un motivo. Il nostro team esamina la segnalazione e ti comunica la decisione.
