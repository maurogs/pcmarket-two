  sell_to_us:
    seo:
      title: Vende a tua GPU ou CPU à PCMarket
      description: Recebe uma oferta imediata pela tua placa gráfica ou processador, envia com etiqueta pré-paga e recebe por transferência bancária.
    hero:
      eyebrow: Vende-nos
      title: Transforma hardware parado em dinheiro, sem o anunciar
      description: Escolhe a GPU ou CPU, responde a quatro perguntas sobre o estado e recebe uma oferta firme em segundos. Se aceitares, enviamos-te uma etiqueta de envio pré-paga.
      cta: Obter oferta imediata
      how_it_works: Como funciona
    prices:
      title: Exemplos de pagamento
      description: Uma amostra dos preços de compra atuais. O teu orçamento imediato usa o modelo e o estado exatos.
      gpus: Placas gráficas
      cpus: Processadores
      model: Modelo
      empty: Ainda não há preços publicados para este componente.
      note: Os pagamentos são estimativas antes da inspeção. A oferta mostrada no orçamento é a que cumprimos.
    how:
      title: Como funciona
      description: Quatro passos desde a tua peça até à transferência.
      steps:
        offer:
          title: Recebe uma oferta
          body: Escolhe o modelo e o estado. A oferta imediata é válida por sete dias.
        ship:
          title: Envia grátis
          body: Aceita a oferta e enviamos por email uma etiqueta pré-paga com instruções de embalagem.
        inspect:
          title: Inspecionamos
          body: Testamos o componente e confirmamos o estado em dois dias úteis.
        paid:
          title: Recebe o pagamento
          body: Transferimos o valor acordado para o teu IBAN, normalmente num dia útil.
    faq:
      title: Perguntas antes de vender
      items:
        condition:
          question: O que conta como estado «bom»?
          answer: O componente funciona normalmente, não tem danos físicos e mostra apenas sinais ligeiros de uso. A falta de caixa ou acessórios reduz a oferta através das perguntas de estado.
        shipping:
          question: Pago o envio?
          answer: Não. Depois de aceitares, enviamos uma etiqueta pré-paga e segurada. Embala o componente com cuidado numa bolsa antiestática e numa caixa resistente.
        payment:
          question: Como e quando recebo?
          answer: Por transferência para o IBAN indicado após a aceitação. Pagamos num dia útil após a inspeção.
        data:
          question: O que acontece aos meus dados pessoais?
          answer: Guardamos o teu IBAN cifrado, usamo-lo apenas para este pagamento e mantemos o pedido durante o período contabilístico exigido por lei.
    cta:
      title: Queres saber quanto vale o teu hardware?
      description: O orçamento demora menos de um minuto e não te compromete.
      button: Começar o meu orçamento
