  trust:
    meta:
      title: Trust & Safety
      description: "Held payments, verified sellers and real support: how we protect every purchase on PCMarket."
    eyebrow: Trust & Safety
    title: Is PCMarket safe?
    subtitle: "Yes: we hold the payment, verify sellers and step in when something goes wrong. That is how we look after every purchase, from the first click to delivery."
    cta:
      browse: Browse listings
      contact: Talk to support
      title: Buy with confidence
      body: Thousands of enthusiasts already buy and sell parts on PCMarket. Join them knowing your money is protected.
      sell: Start selling
    stats:
      label: Platform figures
      listings_sold: listings sold
      active_sellers: active sellers
      average_rating: "average rating (%{count} reviews)"
    protection:
      title: How buyer protection works
      subtitle: Your money does not reach the seller until you confirm everything is right.
      steps:
        hold:
          title: We hold the payment
          body: When you pay, the money is held safely. The seller knows the order is real and you do not expose your funds.
        ship:
          title: The item ships with tracking
          body: The seller packs the order and adds a tracking number. You can follow the delivery from your account.
        inspect:
          title: You inspect the item
          body: "You have %{days} days from delivery to check that everything matches the description. If not, raise an issue before the payment is released."
    covered:
      title: What buyer protection covers
      items:
        - The item never arrives within the expected timeframe.
        - It arrives damaged or does not match the description.
        - The seller cancels after payment.
        - The item is counterfeit or prohibited.
        - You receive something different from what you bought.
      note: Protection covers purchases paid inside PCMarket. Payments made outside the platform cannot be claimed.
    verified:
      title: What "verified seller" means
      intro: The verification badge is not automatic. We award it after checking signals of trust.
      items:
        - Identity and contact details confirmed.
        - An activity history without serious incidents.
        - A correctly configured Stripe payout account.
        - Listings that follow our catalogue rules.
    safety:
      title: Safety tips
      subtitle: A few seconds of care prevent almost every problem.
      tips:
        - Never pay outside PCMarket: you would lose buyer protection.
        - Be wary of anyone asking for Bizum or a direct transfer to "skip fees".
        - If you meet in person, choose a public, busy place.
        - Check the serial number and test the item before completing a cash sale.
        - Keep the conversation on the platform and treat external links with suspicion.
    report:
      title: How to report
      body: If you see a suspicious listing, an abusive message or a possible scam, use the report button on the listing or profile. We review every notice and can remove content, suspend accounts and work with the authorities.
      cta: Report a listing
      contact: Email support
    contact:
      title: Need help?
      body: Our team replies in English and Spanish from Monday to Friday. Tell us what happened in as much detail as you can and we will help you sort it out.
    faq:
      title: Frequently asked questions
      items:
        - question: When does the seller get paid?
          answer: When you confirm delivery or the protection window ends without an issue. Until then the money stays held.
        - question: Can I buy without an account?
          answer: You can browse without an account, but you need a confirmed account to pay. That lets us protect the purchase and notify you about delivery.
        - question: What happens if the item does not arrive?
          answer: Open an issue from the order before the window closes. If the seller cannot prove dispatch, we refund you.
        - question: Is shipping included?
          answer: Each listing shows its shipping cost. Many sellers offer free shipping, and you can filter for that option.
        - question: Can I return an item I do not like?
          answer: If you buy from a business seller you have a 14-day right of withdrawal. Between private sellers that legal right does not exist, but buyer protection covers items that do not match the description.
        - question: How do I know a seller is reliable?
          answer: Check their profile, reviews and whether they have the verification badge. You can also message them before buying.
        - question: Which payment methods do you accept?
          answer: Card payments processed by Stripe. We do not accept cash or transfers outside the platform because we could not protect you.
        - question: How do I report a listing?
          answer: Press "Report" on the listing or profile and choose a reason. Our team reviews the report and tells you the decision.
