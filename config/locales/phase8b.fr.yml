  sell_to_us:
    seo:
      title: Vendez votre GPU ou CPU à PCMarket
      description: Obtenez une offre immédiate pour votre carte graphique ou processeur, expédiez-le avec une étiquette prépayée et soyez payé par virement.
    hero:
      eyebrow: Vendez-nous
      title: Transformez votre matériel inutilisé en argent, sans le mettre en vente
      description: Choisissez votre GPU ou CPU, répondez à quatre questions sur son état et recevez une offre ferme en quelques secondes. Si vous l’acceptez, nous vous envoyons une étiquette d’expédition prépayée.
      cta: Obtenir une offre immédiate
      how_it_works: Comment ça marche
    prices:
      title: Exemples de paiement
      description: Un aperçu des prix de rachat actuels. Votre offre immédiate utilise le modèle et l’état exacts.
      gpus: Cartes graphiques
      cpus: Processeurs
      model: Modèle
      empty: Aucun prix publié pour ce composant pour le moment.
      note: Les paiements sont des estimations avant inspection. L’offre affichée dans le parcours d’offre est celle que nous honorons.
    how:
      title: Comment ça marche
      description: Quatre étapes entre votre pièce et le virement.
      steps:
        offer:
          title: Obtenez une offre
          body: Choisissez le modèle et l’état. L’offre immédiate est valable sept jours.
        ship:
          title: Expédiez gratuitement
          body: Acceptez l’offre et nous vous envoyons une étiquette prépayée avec les instructions d’emballage.
        inspect:
          title: Nous l’inspectons
          body: Nous testons le composant et confirmons son état sous deux jours ouvrés.
        paid:
          title: Soyez payé
          body: Nous virons le montant convenu sur votre IBAN, généralement sous un jour ouvré.
    faq:
      title: Questions avant de vendre
      items:
        condition:
          question: Qu’est-ce qu’un état « bon » ?
          answer: Le composant fonctionne normalement, ne présente aucun dommage physique et montre seulement de légères traces d’utilisation. L’absence de boîte ou d’accessoires réduit l’offre via les questions sur l’état.
        shipping:
          question: L’expédition est-elle payante ?
          answer: Non. Une fois l’offre acceptée, nous envoyons une étiquette prépayée et assurée. Emballez le composant avec soin dans une poche antistatique et un carton solide.
        payment:
          question: Comment et quand suis-je payé ?
          answer: Par virement sur l’IBAN indiqué après acceptation. Nous payons sous un jour ouvré après l’inspection.
        data:
          question: Que deviennent mes données personnelles ?
          answer: Nous stockons votre IBAN de façon chiffrée, l’utilisons uniquement pour ce paiement et conservons la demande pendant la durée comptable légalement requise.
    cta:
      title: Envie de savoir ce que vaut votre matériel ?
      description: L’offre prend moins d’une minute et ne vous engage à rien.
      button: Commencer mon offre
