  trust:
    meta:
      title: Confiança e segurança
      description: "Pagamentos retidos, vendedores verificados e apoio real: é assim que protegemos cada compra no PCMarket."
    eyebrow: Confiança e segurança
    title: O PCMarket é seguro?
    subtitle: "Sim: retemos o pagamento, verificamos os vendedores e intervimos quando algo falha. É assim que cuidamos de cada compra, do primeiro clique à entrega."
    cta:
      browse: Explorar anúncios
      contact: Falar com o apoio
      title: Compra com confiança
      body: Milhares de entusiastas já compram e vendem componentes no PCMarket. Junta-te a eles sabendo que o teu dinheiro está protegido.
      sell: Começar a vender
    stats:
      label: Números da plataforma
      listings_sold: anúncios vendidos
      active_sellers: vendedores ativos
      average_rating: "avaliação média (%{count} avaliações)"
    protection:
      title: Como funciona a proteção do comprador
      subtitle: O teu dinheiro só chega ao vendedor quando confirmas que está tudo bem.
      steps:
        hold:
          title: Retemos o pagamento
          body: Ao pagar, o valor fica retido em segurança. O vendedor sabe que a encomenda é real e tu não expões o teu dinheiro.
        ship:
          title: O artigo é enviado com seguimento
          body: O vendedor prepara a encomenda e adiciona o número de seguimento. Podes acompanhar a entrega na tua conta.
        inspect:
          title: Inspecionas o artigo
          body: "Tens %{days} dias após a entrega para verificar que tudo corresponde à descrição. Caso contrário, abre uma ocorrência antes de o pagamento ser libertado."
    covered:
      title: O que cobre a proteção do comprador
      items:
        - O artigo não chega no prazo previsto.
        - Chega danificado ou não corresponde à descrição.
        - O vendedor cancela depois do pagamento.
        - O artigo é falsificado ou proibido.
        - Recebes algo diferente do que compraste.
      note: A proteção cobre compras pagas dentro do PCMarket. Pagamentos fora da plataforma não podem ser reclamados.
    verified:
      title: O que significa "vendedor verificado"
      intro: O selo de verificação não é automático. Atribuímo-lo depois de verificar sinais de confiança.
      items:
        - Identidade e contactos confirmados.
        - Histórico de atividade sem incidentes graves.
        - Conta de recebimentos Stripe corretamente configurada.
        - Anúncios que cumprem as nossas regras de catálogo.
    safety:
      title: Conselhos de segurança
      subtitle: Alguns segundos de cuidado evitam quase todos os problemas.
      tips:
        - Nunca pagues fora do PCMarket: perderias a proteção do comprador.
        - Desconfia de quem pede Bizum ou transferência direta para "saltar comissões".
        - Se se encontrarem em pessoa, escolham um local público e movimentado.
        - Verifica o número de série e testa o artigo antes de fechar uma venda em mão.
        - Mantém a conversa na plataforma e desconfia de links externos.
    report:
      title: Como denunciar
      body: Se vires um anúncio suspeito, uma mensagem abusiva ou uma possível fraude, usa o botão de denúncia do anúncio ou do perfil. Analisamos cada aviso e podemos remover conteúdo, suspender contas e colaborar com as autoridades.
      cta: Denunciar um anúncio
      contact: Escrever ao apoio
    contact:
      title: Precisas de ajuda?
      body: A nossa equipa responde em português e espanhol de segunda a sexta. Conta-nos o que aconteceu com o máximo de detalhe e ajudamos.
    faq:
      title: Perguntas frequentes
      items:
        - question: Quando recebe o dinheiro o vendedor?
          answer: Quando confirmas a entrega ou termina o prazo de proteção sem problemas. Até lá o valor fica retido.
        - question: Posso comprar sem conta?
          answer: Podes explorar sem conta, mas para pagar precisas de uma conta confirmada. Assim protegemos a compra e avisamos-te da entrega.
        - question: O que acontece se o artigo não chegar?
          answer: Abre uma ocorrência na encomenda antes do fim do prazo. Se o vendedor não conseguir provar o envio, devolvemos o valor.
        - question: O envio está incluído?
          answer: Cada anúncio indica o custo de envio. Muitos vendedores oferecem envio grátis e podes filtrar por essa opção.
        - question: Posso devolver um artigo de que não gosto?
          answer: Se comprares a um vendedor profissional tens 14 dias de livre resolução. Entre particulares esse direito legal não existe, mas a proteção cobre artigos que não correspondam à descrição.
        - question: Como sei se um vendedor é fiável?
          answer: Consulta o perfil, as avaliações e se tem o selo de verificação. Também podes escrever-lhe antes de comprar.
        - question: Que métodos de pagamento aceitam?
          answer: Pagamentos com cartão processados pela Stripe. Não aceitamos dinheiro nem transferências fora da plataforma porque não te poderíamos proteger.
        - question: Como denuncio um anúncio?
          answer: Prime "Denunciar" no anúncio ou perfil e escolhe o motivo. A nossa equipa analisa a denúncia e informa-te da decisão.
