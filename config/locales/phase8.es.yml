  trust:
    meta:
      title: Confianza y seguridad
      description: "Pagos retenidos, vendedores verificados y soporte real: así protegemos cada compra en PCMarket."
    eyebrow: Confianza y seguridad
    title: "¿Es seguro comprar en PCMarket?"
    subtitle: "Sí: retenemos el pago, verificamos a los vendedores y respondemos cuando algo falla. Así cuidamos cada compra, desde el primer clic hasta la entrega."
    cta:
      browse: Explorar anuncios
      contact: Hablar con soporte
      title: Compra con confianza
      body: Miles de aficionados ya compran y venden componentes en PCMarket. Únete con la tranquilidad de saber que tu dinero está protegido.
      sell: Empezar a vender
    stats:
      label: Datos de la plataforma
      listings_sold: anuncios vendidos
      active_sellers: vendedores activos
      average_rating: "valoración media (%{count} reseñas)"
    protection:
      title: Cómo funciona la protección al comprador
      subtitle: Tu dinero no llega al vendedor hasta que tú confirmas que todo está bien.
      steps:
        hold:
          title: Retenemos el pago
          body: Al pagar, el importe queda retenido de forma segura. El vendedor sabe que hay una compra real y tú no expones tu dinero.
        ship:
          title: El artículo se envía con seguimiento
          body: El vendedor prepara el pedido y sube el número de seguimiento. Puedes seguir el envío desde tu cuenta.
        inspect:
          title: Revisas el artículo
          body: "Tienes %{days} días desde la entrega para comprobar que todo está como se describía. Si hay un problema, abre una incidencia antes de que se libere el pago."
    covered:
      title: Qué cubre la protección al comprador
      items:
        - Si el artículo no llega en el plazo previsto.
        - Si llega dañado o no coincide con la descripción.
        - Si el vendedor cancela después del pago.
        - Si el artículo es falsificado o está prohibido.
        - Si recibes algo distinto de lo que compraste.
      note: La protección cubre compras pagadas dentro de PCMarket. Los pagos fuera de la plataforma no se pueden reclamar.
    verified:
      title: Qué significa "vendedor verificado"
      intro: El sello de verificación no es automático. Lo concedemos después de revisar señales de confianza.
      items:
        - Identidad y datos de contacto comprobados.
        - Historial de actividad sin incidencias graves.
        - Cuenta de cobro de Stripe correctamente configurada.
        - Anuncios que cumplen nuestras normas de catálogo.
    safety:
      title: Consejos de seguridad
      subtitle: Unos segundos de precaución evitan casi todos los problemas.
      tips:
        - No pagues nunca fuera de PCMarket: perderías la protección al comprador.
        - Desconfía de quien pida Bizum o transferencia directa para "saltarse comisiones".
        - Si quedáis en persona, elegid un lugar público y concurrido.
        - Comprueba el número de serie y prueba el equipo antes de cerrar una compra en mano.
        - Mantén la conversación en la plataforma y desconfía de enlaces externos.
    report:
      title: Cómo denunciar
      body: Si ves un anuncio sospechoso, un mensaje abusivo o una posible estafa, usa el botón de denuncia del anuncio o del perfil. Revisamos cada aviso y podemos retirar contenido, suspender cuentas y colaborar con las autoridades.
      cta: Denunciar un anuncio
      contact: Escribir a soporte
    contact:
      title: ¿Necesitas ayuda?
      body: Nuestro equipo responde en español de lunes a viernes. Cuéntanos qué ha pasado con el mayor detalle posible y te ayudaremos a resolverlo.
    faq:
      title: Preguntas frecuentes
      items:
        - question: ¿Cuándo recibe el dinero el vendedor?
          answer: Cuando confirmas la entrega o termina el plazo de protección sin incidencias. Hasta entonces el importe permanece retenido.
        - question: ¿Puedo comprar sin cuenta?
          answer: Puedes explorar sin cuenta, pero para pagar necesitas una cuenta confirmada. Así podemos proteger la compra y avisarte del envío.
        - question: ¿Qué pasa si el artículo no llega?
          answer: Abre una incidencia desde el pedido antes de que termine el plazo. Si el vendedor no puede demostrar el envío, te devolvemos el importe.
        - question: ¿Los envíos están incluidos?
          answer: Cada anuncio indica su coste de envío. Muchos vendedores ofrecen envío gratuito y puedes filtrar por esa opción.
        - question: ¿Puedo devolver un artículo que no me convence?
          answer: Si compras a un vendedor profesional tienes 14 días de desistimiento. Entre particulares no existe ese derecho legal, pero la protección al comprador cubre artículos que no coincidan con la descripción.
        - question: ¿Cómo sé que un vendedor es de fiar?
          answer: Revisa su perfil, sus valoraciones y si tiene el sello de verificación. También puedes escribirle antes de comprar.
        - question: ¿Qué métodos de pago aceptáis?
          answer: Pagos con tarjeta procesados por Stripe. No aceptamos efectivo ni transferencias fuera de la plataforma porque no podríamos protegerte.
        - question: ¿Cómo denuncio un anuncio?
          answer: Pulsa "Denunciar" en el anuncio o perfil y elige el motivo. Nuestro equipo revisa la denuncia y te informa de la decisión.
