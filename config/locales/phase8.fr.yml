  trust:
    meta:
      title: Confiance et sécurité
      description: "Paiements retenus, vendeurs vérifiés et vrai support : voici comment nous protégeons chaque achat sur PCMarket."
    eyebrow: Confiance et sécurité
    title: PCMarket est-il sûr ?
    subtitle: "Oui : nous retenons le paiement, vérifions les vendeurs et intervenons en cas de problème. C'est ainsi que nous protégeons chaque achat, du premier clic à la livraison."
    cta:
      browse: Explorer les annonces
      contact: Parler au support
      title: Achetez en confiance
      body: Des milliers de passionnés achètent et vendent déjà des composants sur PCMarket. Rejoignez-les en sachant que votre argent est protégé.
      sell: Commencer à vendre
    stats:
      label: Chiffres de la plateforme
      listings_sold: annonces vendues
      active_sellers: vendeurs actifs
      average_rating: "note moyenne (%{count} avis)"
    protection:
      title: Comment fonctionne la protection de l'acheteur
      subtitle: Votre argent ne parvient au vendeur que lorsque vous confirmez que tout est en ordre.
      steps:
        hold:
          title: Nous retenons le paiement
          body: Au paiement, le montant est conservé en sécurité. Le vendeur sait que la commande est réelle et vous ne risquez pas vos fonds.
        ship:
          title: L'article est expédié avec suivi
          body: Le vendeur prépare la commande et ajoute un numéro de suivi. Vous pouvez suivre la livraison depuis votre compte.
        inspect:
          title: Vous vérifiez l'article
          body: "Vous disposez de %{days} jours après la livraison pour vérifier que tout correspond à la description. Sinon, ouvrez un litige avant la libération du paiement."
    covered:
      title: Ce que couvre la protection de l'acheteur
      items:
        - L'article n'arrive pas dans le délai prévu.
        - Il arrive endommagé ou ne correspond pas à la description.
        - Le vendeur annule après le paiement.
        - L'article est contrefait ou interdit.
        - Vous recevez autre chose que ce que vous avez acheté.
      note: La protection couvre les achats payés sur PCMarket. Les paiements effectués hors plateforme ne peuvent pas être réclamés.
    verified:
      title: Que signifie « vendeur vérifié » ?
      intro: Le badge de vérification n'est pas automatique. Nous l'accordons après avoir contrôlé des signaux de confiance.
      items:
        - Identité et coordonnées confirmées.
        - Un historique d'activité sans incident grave.
        - Un compte de versement Stripe correctement configuré.
        - Des annonces conformes à nos règles de catalogue.
    safety:
      title: Conseils de sécurité
      subtitle: Quelques secondes de prudence évitent presque tous les problèmes.
      tips:
        - Ne payez jamais en dehors de PCMarket : vous perdriez la protection de l'acheteur.
        - Méfiez-vous de quiconque demande un Bizum ou un virement direct pour « éviter les frais ».
        - Pour un rendez-vous, choisissez un lieu public et fréquenté.
        - Vérifiez le numéro de série et testez l'article avant de conclure une vente en main propre.
        - Gardez la conversation sur la plateforme et méfiez-vous des liens externes.
    report:
      title: Comment signaler
      body: Si vous voyez une annonce suspecte, un message abusif ou une possible arnaque, utilisez le bouton de signalement de l'annonce ou du profil. Nous examinons chaque signalement et pouvons retirer du contenu, suspendre des comptes et collaborer avec les autorités.
      cta: Signaler une annonce
      contact: Écrire au support
    contact:
      title: Besoin d'aide ?
      body: Notre équipe répond en français et en espagnol du lundi au vendredi. Décrivez-nous ce qui s'est passé le plus précisément possible et nous vous aiderons.
    faq:
      title: Questions fréquentes
      items:
        - question: Quand le vendeur est-il payé ?
          answer: Lorsque vous confirmez la livraison ou que le délai de protection se termine sans incident. D'ici là, le montant reste retenu.
        - question: Puis-je acheter sans compte ?
          answer: Vous pouvez parcourir sans compte, mais il faut un compte confirmé pour payer. Cela nous permet de protéger l'achat et de vous prévenir de la livraison.
        - question: Que se passe-t-il si l'article n'arrive pas ?
          answer: Ouvrez un litige depuis la commande avant la fin du délai. Si le vendeur ne peut pas prouver l'expédition, nous vous remboursons.
        - question: Les frais de port sont-ils inclus ?
          answer: Chaque annonce indique ses frais de port. De nombreux vendeurs proposent la livraison gratuite et vous pouvez filtrer sur cette option.
        - question: Puis-je retourner un article qui ne me plaît pas ?
          answer: Si vous achetez à un vendeur professionnel, vous disposez de 14 jours de rétractation. Entre particuliers, ce droit n'existe pas, mais la protection couvre les articles non conformes.
        - question: Comment savoir si un vendeur est fiable ?
          answer: Consultez son profil, ses avis et son badge de vérification. Vous pouvez aussi lui écrire avant d'acheter.
        - question: Quels moyens de paiement acceptez-vous ?
          answer: Les paiements par carte traités par Stripe. Nous n'acceptons ni espèces ni virements hors plateforme, car nous ne pourrions pas vous protéger.
        - question: Comment signaler une annonce ?
          answer: Appuyez sur « Signaler » dans l'annonce ou le profil et choisissez un motif. Notre équipe examine le signalement et vous informe de sa décision.
