# i18n-tasks configuration: https://github.com/glebm/i18n-tasks

base_locale: es
locales: [es, en, fr, de, it, pt]

data:
  read:
    - config/locales/**/*.yml
  yaml:
    write:
      line_width: -1

search:
  paths:
    - app/
    - config/
    - lib/
    - test/
  exclude:
    - app/assets/images
    - app/assets/fonts
    - app/assets/videos
    - app/assets/builds

# Referenced dynamically by the locale switcher and category nav in the layout.
# Country names are resolved from the code, setting descriptions are rendered
# by the admin UI, and Devise resolves its failure keys at runtime.
ignore_unused:
  - "locale.names.*"
  - "nav.categories.*"
  - "countries.*"
  - "settings.*"
  - "devise.failure.*"
  - "activerecord.*"
  - "listings.conditions.*"
  - "listings.statuses.*"
  - "listings.shipping_modes.*"
  - "listings.attribute_groups.*"
  - "sell.details.conditions.*"
  - "sell.listings.tabs.*"
  - "admin.nav.*"
  - "admin.dashboard.kpis.*"
  - "admin.moderation.reasons.*"
  - "admin.moderation.actions.*"
  - "admin.moderation.notices.*"
  - "admin.moderation.filters.seller_kinds.*"
  - "stores.form.individual"
  - "stores.form.business"
  - "stores.form.individual_hint"
  - "stores.form.business_hint"
  - "orders.statuses.*"
  - "orders.fulfilments.*"
  - "orders.carriers.*"
  - "orders.events.*"
  - "store_payments.requirements.*"
  - "cart.unavailable.reasons.*"
  - "cart.purchase_blocked.*"
  - "cart.errors.*"
  - "checkout.errors.*"
  - "errors.messages.invalid_spanish_tax_id"
  - "errors.messages.invalid_image_type"
  - "errors.messages.image_too_large"
  - "errors.messages.too_many_images"
  - "wishlist.tabs.*"
  - "saved_searches.frequency_options.*"
  - "notifications.messages.*"
  - "notifications.filters.*"
  - "notifications.preferences.kinds.*"
  - "sell.dashboard.nav.*"
  - "account.settings.sidebar.*"
  - "conversations.errors.*"
  - "conversations.index.tabs.*"
  - "messages.errors.*"
  - "offers.errors.*"
  - "offers.statuses.*"
  - "offers.flash.*"
  - "offers.system.*"
  - "blocks.errors.*"
  - "reports.errors.*"
  - "reports.reasons.*"
  - "admin.reports.*"
  - "offer_mailer.*"
  - "report_mailer.decisions.*"

# Devise resolves its failure keys at runtime through devise-i18n, outside
# config/locales, so i18n-tasks cannot see them.
ignore_missing:
  - "devise.*"
